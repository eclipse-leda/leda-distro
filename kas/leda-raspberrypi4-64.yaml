# Every file needs to contain a header, that provides kas with information
# about the context of this file.
header:
  version: 12
  includes:
  - kas/common-wrynose.yaml
machine: raspberrypi4-64
local_conf_header:
  wifi-firmware: |
    # The Pi 4 Model B uses BCM43455; avoid RPi-Distro firmware packages,
    # including the Synaptics-licensed BCM43456 variant.
    MACHINE_EXTRA_RRECOMMENDS:remove = " linux-firmware-rpidistro-bcm43455 linux-firmware-rpidistro-bcm43456"
repos:
  meta-rauc-community:
    url: "https://github.com/rauc/meta-rauc-community.git"
    branch: master
    commit: 4d666ae4956f1cfacbd1a844f2e1794cb7784e2a
    layers:
      meta-rauc-raspberrypi:
  meta-raspberrypi:
    url: "https://git.yoctoproject.org/meta-raspberrypi"
    branch: wrynose
    commit: 919588393f41b48cb6c5d832aa35e58a19b6762d
